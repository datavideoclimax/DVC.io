            width: 100%;
        }
    }
</style>





<div id="fullscreen-overlay" class="fullscreen-overlay">
    <img id="fullscreen-image" src="" alt="全屏图片">
    <span class="close-button">&times;</span>
</div>

<script>
    window.addEventListener('scroll', function() {
        var nav = document.querySelector('.top-nav');
        if (window.scrollY > 50) {
            nav.classList.add('transparent');
        } else {
            nav.classList.remove('transparent');
        }
    });

    // 确保两张图片在一行，位置居中，大小适中
    function adjustImageSize() {
        var imageItems = document.querySelectorAll('.image-item');
        var containerWidth = document.querySelector('.container').offsetWidth;
        var targetWidth = Math.min(containerWidth * 0.55, 550); // 每张图片最大宽度为400px或容器宽度的40%
        var targetHeight = targetWidth * 0.5; // 假设图片比例为4:3

        imageItems.forEach(function(item, index) {
            var img = item.querySelector('img');
            img.style.width = targetWidth + 'px';
            img.style.height = targetHeight + 'px';
            img.style.objectFit = 'cover';
            item.style.width = targetWidth + 'px';
            item.style.margin = '0 10px 20px'; // 调整margin以确保两张图片在一行
            if (index % 2 === 0) {
                item.style.marginLeft = 'auto'; // 偶数索引的图片靠右对齐
            } else {
                item.style.marginRight = 'auto'; // 奇数索引的图片靠左对齐
            }
        });
    }

    // 页面加载时调整图片大小
    window.addEventListener('load', adjustImageSize);

    // 窗口大小改变时调整图片大小
    window.addEventListener('resize', adjustImageSize);

    // 点击图片展开全屏
    var expandableImages = document.querySelectorAll('.expandable-image');
    var fullscreenOverlay = document.getElementById('fullscreen-overlay');
    var fullscreenImage = document.getElementById('fullscreen-image');
    var closeButton = document.querySelector('.close-button');

    expandableImages.forEach(function(img) {
        img.addEventListener('click', function() {
            fullscreenImage.src = this.src;
            fullscreenOverlay.style.display = 'flex';
        });
    });

    closeButton.addEventListener('click', function() {
        fullscreenOverlay.style.display = 'none';
    });

    fullscreenOverlay.addEventListener('click', function(e) {
        if (e.target === fullscreenOverlay) {
            fullscreenOverlay.style.display = 'none';
        }
    });
</script>

<style>
    .image-item {
        position: relative;
        cursor: pointer;
    }
    .expand-icon {
        position: absolute;
        bottom: 10px;
        right: 10px;
        background-color: rgba(255, 255, 255, 0.7);
        border-radius: 50%;
        padding: 5px;
        font-size: 20px;
    }
    .fullscreen-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    #fullscreen-image {
        max-width: 90%;
        max-height: 90%;
        object-fit: contain;
    }
    .close-button {
        position: absolute;
        top: 20px;
        right: 30px;
        color: white;
        font-size: 40px;
        cursor: pointer;
    }
</style>
